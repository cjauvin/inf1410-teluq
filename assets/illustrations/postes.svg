<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 3 772 384" class="fig-svg" role="img"
     aria-label="Deux vignettes en cuisine. À gauche, sous le titre Partager, deux cuisiniers se tiennent de part et d'autre d'un seul poste de travail, une planche et un couteau, vers lequel chacun tend la main par un trait en pointillé ; un cadenas est posé sur le couteau. À droite, sous le titre Ne pas partager, chaque cuisinier a son propre poste complet, planche, couteau et casserole, et entre les deux postes une assiette passe par le passe, de gauche à droite, sans jamais être tenue par les deux à la fois.">

  <!-- Le même vocabulaire que la figure de l'introduction. À gauche, un seul
       poste et deux mains : il faut un cadenas, et c'est lui qui remet les
       cuisiniers en file. À droite, deux postes et rien en commun : ce qui
       doit passer de l'un à l'autre passe par le passe, jamais de main à main.
       Le cadenas ne sert plus à rien, il n'y est pas. -->

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">

    <!-- ═══ Partager ═══ -->
    <text x="40" y="46" font-size="19" font-weight="700">Partager</text>
    <path d="M60 180 H 340" stroke="currentColor" stroke-width="2.4" opacity="0.4" stroke-linecap="round"/>
    <g transform="translate(200,172)" style="color: var(--a3, #c06e4a)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-52" y="-8" width="48" height="12" rx="2" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
      <circle cx="-44" cy="-2" r="1.8" fill="currentColor" stroke="none" opacity="0.6"/>
      <g transform="translate(-28,-16)" stroke-width="1.8">
        <rect x="-16" y="-3" width="13" height="6" rx="1.5" fill="currentColor" fill-opacity="0.35"/>
        <path d="M-3 -3 L 16 -3 L 20 0 L 16 3 L -3 3 Z" fill="currentColor" fill-opacity="0.14"/>
      </g>
      <g transform="translate(30,-10)">
        <rect x="-20" y="-6" width="40" height="22" rx="4" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
        <path d="M-24 -6 H 24" stroke-width="2" fill="none"/>
        <g stroke-width="1.6" fill="none" opacity="0.6">
          <path d="M-8 -12 q 4 -6 0 -12"/><path d="M8 -12 q 4 -6 0 -12"/>
        </g>
      </g>
    </g>
    <g transform="translate(172,132)" style="color: var(--a3, #c06e4a)" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-5 -2 V -7 a 5 5 0 0 1 10 0 V -2" fill="none"/>
      <rect x="-8" y="-2" width="16" height="12" rx="2" fill="currentColor" fill-opacity="0.25"/>
    </g>
    <g style="color: var(--a3, #c06e4a)" stroke="currentColor" fill="none" stroke-width="1.7" opacity="0.6" stroke-dasharray="5 6">
      <path d="M112 232 C 125 210, 150 190, 172 174"/>
      <path d="M288 232 C 275 210, 250 190, 200 174"/>
    </g>
    <g transform="translate(105,292)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z"
              fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none">
          <path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/>
          <path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/>
          <path d="M10 -27 C 12 -36, 9 -43, 6 -47"/>
        </g>
      </g>
    </g>
    <g transform="translate(295,292)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z"
              fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none">
          <path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/>
          <path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/>
          <path d="M10 -27 C 12 -36, 9 -43, 6 -47"/>
        </g>
      </g>
    </g>
    <text x="40" y="360" font-size="15.5" font-weight="600">Un couteau, deux mains, un cadenas.</text>

    <path d="M400 34 V 345" stroke="currentColor" stroke-width="1.2" opacity="0.2"/>

    <!-- ═══ Ne pas partager ═══ -->
    <text x="430" y="46" font-size="19" font-weight="700">Ne pas partager</text>
    <path d="M440 180 H 560" stroke="currentColor" stroke-width="2.4" opacity="0.4" stroke-linecap="round"/>
    <path d="M640 180 H 760" stroke="currentColor" stroke-width="2.4" opacity="0.4" stroke-linecap="round"/>
    <g transform="translate(505,172)" style="color: var(--a1, #5b7fa6)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-52" y="-8" width="48" height="12" rx="2" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
      <circle cx="-44" cy="-2" r="1.8" fill="currentColor" stroke="none" opacity="0.6"/>
      <g transform="translate(-28,-16)" stroke-width="1.8">
        <rect x="-16" y="-3" width="13" height="6" rx="1.5" fill="currentColor" fill-opacity="0.35"/>
        <path d="M-3 -3 L 16 -3 L 20 0 L 16 3 L -3 3 Z" fill="currentColor" fill-opacity="0.14"/>
      </g>
      <g transform="translate(30,-10)">
        <rect x="-20" y="-6" width="40" height="22" rx="4" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
        <path d="M-24 -6 H 24" stroke-width="2" fill="none"/>
        <g stroke-width="1.6" fill="none" opacity="0.6">
          <path d="M-8 -12 q 4 -6 0 -12"/><path d="M8 -12 q 4 -6 0 -12"/>
        </g>
      </g>
    </g>
    <g transform="translate(705,172)" style="color: var(--a2, #6f9455)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-52" y="-8" width="48" height="12" rx="2" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
      <circle cx="-44" cy="-2" r="1.8" fill="currentColor" stroke="none" opacity="0.6"/>
      <g transform="translate(-28,-16)" stroke-width="1.8">
        <rect x="-16" y="-3" width="13" height="6" rx="1.5" fill="currentColor" fill-opacity="0.35"/>
        <path d="M-3 -3 L 16 -3 L 20 0 L 16 3 L -3 3 Z" fill="currentColor" fill-opacity="0.14"/>
      </g>
      <g transform="translate(30,-10)">
        <rect x="-20" y="-6" width="40" height="22" rx="4" stroke-width="2" fill="currentColor" fill-opacity="0.14"/>
        <path d="M-24 -6 H 24" stroke-width="2" fill="none"/>
        <g stroke-width="1.6" fill="none" opacity="0.6">
          <path d="M-8 -12 q 4 -6 0 -12"/><path d="M8 -12 q 4 -6 0 -12"/>
        </g>
      </g>
    </g>
    <!-- Le passe : un comptoir sur pieds, une assiette sous cloche, la flèche
         qui va du poste de gauche au poste de droite, et le mot, parce que
         l'objet n'est pas universellement connu. -->
    <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="2.2" opacity="0.5" fill="none">
        <path d="M562 146 H 638"/>
        <path d="M570 146 V 158"/><path d="M630 146 V 158"/>
      </g>
      <g transform="translate(600,144)" stroke-width="1.8">
        <ellipse rx="21" ry="6.5" fill="currentColor" fill-opacity="0.12"/>
        <ellipse rx="14" ry="3.6" fill="none" opacity="0.55"/>
        <path d="M-15 -1 a 15 15 0 0 1 30 0" fill="currentColor" fill-opacity="0.10"/>
        <circle cx="0" cy="-16" r="2.2" fill="currentColor" stroke="none" opacity="0.7"/>
      </g>
      <g fill="none" stroke-width="1.7" opacity="0.6">
        <path d="M548 104 H 652"/><path d="M644 98 L 652 104 L 644 110"/>
      </g>
      <text x="600" y="174" font-size="12.5" text-anchor="middle" opacity="0.75" stroke="none">le passe</text>
    </g>
    <g stroke="currentColor" fill="none" stroke-width="1.7" opacity="0.45">
      <path d="M505 232 V 190"/><path d="M705 232 V 190"/>
    </g>
    <g transform="translate(505,292)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z"
              fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none">
          <path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/>
          <path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/>
          <path d="M10 -27 C 12 -36, 9 -43, 6 -47"/>
        </g>
      </g>
    </g>
    <g transform="translate(705,292)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z"
              fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none">
          <path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/>
          <path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/>
          <path d="M10 -27 C 12 -36, 9 -43, 6 -47"/>
        </g>
      </g>
    </g>
    <text x="430" y="360" font-size="15.5" font-weight="600">Chacun son poste. Le plat passe par le passe.</text>
  </g>
</svg>
