<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 14 840 422" class="fig-svg" role="img"
     aria-label="Une fenêtre de terminal. Un même programme, compteur.py, qui devrait afficher 4 000 000, est lancé cinq fois de suite sur la même machine. Il répond successivement 1 037 022, puis 982 724, puis 979 608, puis 995 444, puis 998 221. Aucune de ces réponses n'est la bonne, et aucune n'est identique à une autre.">

  <!-- ══ La fenêtre ══ -->
  <g stroke="currentColor" fill="none" opacity="0.35" stroke-width="1.4">
    <rect x="40" y="34" width="800" height="316" rx="9"/>
    <path d="M40 74 H 840"/>
  </g>
  <g fill="currentColor" stroke="none" opacity="0.3">
    <circle cx="64" cy="54" r="4.5"/><circle cx="80" cy="54" r="4.5"/><circle cx="96" cy="54" r="4.5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="16" fill="currentColor">

    <!-- Ce que le programme devrait afficher. Neutre, et constant. -->
    <text x="70" y="112" opacity="0.8">attendu&#160;: 4 000 000</text>
    <path d="M70 126 H 810" stroke="currentColor" stroke-width="1" opacity="0.18"/>

    <!-- Les cinq exécutions. La commande ne change jamais, la réponse toujours.
         Seuls les nombres portent la couleur d'accent : l'oeil voit alors une
         colonne fixe et une colonne qui bouge, avant même de lire. -->
    <g>
      <g opacity="0.6">
        <text x="70" y="164">$ python compteur.py</text>
        <text x="70" y="202">$ python compteur.py</text>
        <text x="70" y="240">$ python compteur.py</text>
        <text x="70" y="278">$ python compteur.py</text>
        <text x="70" y="316">$ python compteur.py</text>
      </g>
      <g opacity="0.45">
        <text x="330" y="164">obtenu&#160;:</text>
        <text x="330" y="202">obtenu&#160;:</text>
        <text x="330" y="240">obtenu&#160;:</text>
        <text x="330" y="278">obtenu&#160;:</text>
        <text x="330" y="316">obtenu&#160;:</text>
      </g>
      <g style="color: var(--a3, #c06e4a)" fill="currentColor" font-weight="700" text-anchor="end">
        <text x="580" y="164">1 037 022</text>
        <text x="580" y="202">982 724</text>
        <text x="580" y="240">979 608</text>
        <text x="580" y="278">995 444</text>
        <text x="580" y="316">998 221</text>
      </g>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">
    <text x="40" y="388" font-size="17" font-weight="600">Le même fichier. La même machine. Cinq réponses, toutes fausses, toutes différentes.</text>
    <text x="40" y="414" font-size="13.5" opacity="0.7">Quatre tâches ajoutent 1 à un compteur, un million de fois chacune. Le total devrait donc être quatre millions.</text>
  </g>
</svg>
