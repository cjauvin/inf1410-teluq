<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 6 1262 316" class="fig-svg" role="img"
     aria-label="Trois vignettes en cuisine, avec toujours trois plats à faire. Dans la première, intitulée Séquentiel, un cuisinier et trois casseroles reliées par des flèches : il les fait l'une après l'autre. Dans la deuxième, intitulée Concurrence, le même cuisinier seul devant trois casseroles alignées sur un plan de cuisson, toutes en train de cuire, reliées à lui par trois traits en pointillé : il passe de l'une à l'autre et les trois plats avancent ensemble. Dans la troisième, intitulée Parallélisme, trois cuisiniers devant les trois mêmes casseroles, chacun relié à la sienne. Du premier au deuxième dessin, seule l'organisation du cuisinier change ; du deuxième au troisième, c'est le nombre de cuisiniers.">

  <!-- Trois plats à faire dans les trois cas. Ce qui change d'une vignette à
       l'autre, ce sont deux choses distinctes : l'organisation du travail entre
       la première et la deuxième, les ressources entre la deuxième et la
       troisième. C'est exactement la distinction de Rob Pike. -->

