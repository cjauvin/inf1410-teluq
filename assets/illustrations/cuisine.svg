<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 7 703 603" class="fig-svg" role="img"
     aria-label="Trois rangées en cuisine, avec toujours trois plats à faire. Première rangée, Séquentiel : un cuisinier et trois casseroles reliées par des flèches, il les fait l'une après l'autre. Deuxième rangée, Concurrence : le même cuisinier, seul, devant les trois casseroles alignées sur un plan de cuisson et toutes en train de cuire, reliées à lui par trois traits en pointillé. Troisième rangée, Parallélisme : trois cuisiniers devant les trois mêmes casseroles, chacun relié à la sienne. Du premier dessin au deuxième, seule l'organisation du cuisinier change ; du deuxième au troisième, c'est le nombre de cuisiniers.">

  <!-- Trois plats à faire dans les trois cas, ce qui fait de la comparaison une
       expérience contrôlée. Ce qui change, ce sont deux choses distinctes :
       l'organisation entre la première rangée et la deuxième, les ressources
       entre la deuxième et la troisième. C'est la distinction de Rob Pike.

       Empilement vertical plutôt que trois colonnes : à trois colonnes dans une
       largeur de texte, l'échelle tombe sous 0,7 et les casseroles deviennent
       minuscules. -->

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">

    <!-- ═══ Séquentiel ═══ -->
