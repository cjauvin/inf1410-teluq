<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 708 520" class="fig-svg" role="img"
     aria-label="Trois vignettes en cuisine disposées en triangle, avec toujours trois plats à faire. En haut, Séquentiel : un cuisinier et trois casseroles reliées par des flèches, il les fait l'une après l'autre. En bas à gauche, Concurrence : le même cuisinier, seul, devant les trois casseroles alignées sur un plan de cuisson et toutes en train de cuire, reliées à lui par trois traits en pointillé. En bas à droite, Parallélisme : trois cuisiniers devant les trois mêmes casseroles, chacun relié à la sienne. Les deux vignettes du bas sont deux façons différentes de s'écarter de celle du haut : dans la première seule l'organisation du cuisinier change, dans la seconde c'est le nombre de cuisiniers.">

  <!-- Disposition en triangle : le séquentiel en haut est le point de départ,
       et les deux cas du bas en sont deux écarts distincts. En file, on aurait
       suggéré une progression alors qu'il s'agit de deux branches.

       Une teinte par cas, sur le titre et les casseroles. Les cuisiniers restent
       neutres, puisque ce qui distingue les vignettes n'est pas eux. -->

