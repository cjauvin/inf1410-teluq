<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" class="fig-svg" role="img"
     aria-label="Deux vignettes en cuisine côte à côte, avec trois casseroles sur le feu dans chacune. À gauche, Threads : un cuisinier sous chaque casserole, et une file qui continue. Un seul est en train de cuisiner, les deux autres sont estompés, plantés devant leur casserole. Une flèche venue d'une étiquette « l'ordonnanceur » tape sur l'épaule de celui qui cuisine. À droite, Boucle d'événements : un seul cuisinier pour les trois casseroles, et une sonnette au-dessus de chacune. La sonnette de droite sonne, et le trait qui relie le cuisinier à cette casserole est plein, alors que les deux autres sont en pointillé.">

  <!-- La même scène deux fois, pour que la différence saute aux yeux : elle
       n'est pas dans les casseroles ni dans le nombre de plats, mais dans qui
       déplace le cuisinier. À gauche, c'est l'ordonnanceur qui pousse. À
       droite, c'est la casserole qui appelle. Cuisiniers et casseroles sont
       repris tels quels de cuisine.svg, pour qu'on les reconnaisse. -->

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">

    <!-- ═══ Threads ═══ -->
    <text x="190" y="34" font-size="19" font-weight="700" text-anchor="middle"
          style="color: var(--a1, #5b7fa6)" fill="currentColor">Threads</text>
    <g style="color: var(--a1, #5b7fa6)" stroke="currentColor" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M40 152 H 340" stroke-width="2.4"/>
    </g>
    <g style="color: var(--a1, #5b7fa6)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(110,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>
      <g transform="translate(190,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>
      <g transform="translate(270,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>
    </g>

    <!-- Le cuisinier qui avance : trait plein, et l'ordonnanceur qui le pousse -->
    <g style="color: var(--a1, #5b7fa6)" stroke="currentColor" fill="none" stroke-width="1.7" opacity="0.5">
      <path d="M110 196 V 160"/>
    </g>
    <g transform="translate(110,258)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z" fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none"><path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/><path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/><path d="M10 -27 C 12 -36, 9 -43, 6 -47"/></g>
      </g>
    </g>
    <text x="6" y="200" font-size="13" opacity="0.8">l'ordonnanceur</text>
    <g stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M58 206 C 66 228, 76 250, 88 269"/>
      <path d="M80 263 L 88 269 L 79 272"/>
      <path d="M76 279 q -3 5 0 10" opacity="0.6"/><path d="M70 277 q -4 7 0 14" opacity="0.4"/>
    </g>

    <!-- Les cuisiniers plantés, estompés : ils existent, ils coûtent, ils n'avancent pas -->
    <g opacity="0.35">
      <g style="color: var(--a1, #5b7fa6)" stroke="currentColor" fill="none" stroke-width="1.7" opacity="0.5">
        <path d="M190 196 V 160"/><path d="M270 196 V 160"/>
      </g>
      <g transform="translate(190,258)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
        <circle cx="0" cy="-7" r="11" fill="none"/>
        <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
        <g transform="rotate(-5 0 -17.5)">
          <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
          <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z" fill="currentColor" fill-opacity="0.10"/>
          <g stroke-width="1.2" opacity="0.45" fill="none"><path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/><path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/><path d="M10 -27 C 12 -36, 9 -43, 6 -47"/></g>
        </g>
      </g>
      <g transform="translate(270,258)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
        <circle cx="0" cy="-7" r="11" fill="none"/>
        <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
        <g transform="rotate(-5 0 -17.5)">
          <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
          <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z" fill="currentColor" fill-opacity="0.10"/>
          <g stroke-width="1.2" opacity="0.45" fill="none"><path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/><path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/><path d="M10 -27 C 12 -36, 9 -43, 6 -47"/></g>
        </g>
      </g>
      <text x="318" y="262" font-size="22" font-weight="700">…</text>
    </g>

    <text x="190" y="318" font-size="13.5" text-anchor="middle" opacity="0.75">un cuisinier par casserole</text>
    <text x="190" y="336" font-size="13.5" text-anchor="middle" opacity="0.75">le système choisit lequel avance</text>

    <!-- Séparateur -->
    <path d="M380 22 V 300" stroke="currentColor" stroke-width="1.2" opacity="0.25"/>

    <!-- ═══ Boucle d'événements ═══ -->
    <text x="570" y="34" font-size="19" font-weight="700" text-anchor="middle"
          style="color: var(--a2, #6f9455)" fill="currentColor">Boucle d'événements</text>
    <g style="color: var(--a2, #6f9455)" stroke="currentColor" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M420 152 H 720" stroke-width="2.4"/>
    </g>
    <g style="color: var(--a2, #6f9455)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(490,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>
      <g transform="translate(570,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>
      <g transform="translate(650,118)">
        <rect x="-26" y="-6" width="52" height="30" rx="5" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
        <g stroke-width="2" fill="none"><path d="M-31 -6 H 31"/><path d="M-31 0 q -7 5 0 10"/><path d="M31 0 q 7 5 0 10"/></g>
        <g stroke-width="1.8" fill="none" opacity="0.6"><path d="M-12 -14 q 5 -7 0 -14"/><path d="M0 -18 q 5 -8 0 -16"/><path d="M12 -14 q 5 -7 0 -14"/></g>
      </g>

      <!-- Une sonnette par casserole. Celle de droite sonne. -->
      <g transform="translate(490,66)" stroke-width="1.6">
        <path d="M-7 0 C -7 -9, -3 -13, 0 -13 C 3 -13, 7 -9, 7 0 Z" fill="currentColor" fill-opacity="0.16"/>
        <path d="M-9 0 H 9" fill="none"/><circle cx="0" cy="3" r="1.6" stroke="none" fill="currentColor"/>
      </g>
      <g transform="translate(570,66)" stroke-width="1.6">
        <path d="M-7 0 C -7 -9, -3 -13, 0 -13 C 3 -13, 7 -9, 7 0 Z" fill="currentColor" fill-opacity="0.16"/>
        <path d="M-9 0 H 9" fill="none"/><circle cx="0" cy="3" r="1.6" stroke="none" fill="currentColor"/>
      </g>
      <g transform="translate(650,66) rotate(14)" stroke-width="1.6">
        <path d="M-7 0 C -7 -9, -3 -13, 0 -13 C 3 -13, 7 -9, 7 0 Z" fill="currentColor" fill-opacity="0.35"/>
        <path d="M-9 0 H 9" fill="none"/><circle cx="0" cy="3" r="1.6" stroke="none" fill="currentColor"/>
        <g fill="none" stroke-width="1.5"><path d="M-14 -10 q -4 5 0 10"/><path d="M-19 -13 q -6 8 0 16" opacity="0.5"/><path d="M14 -10 q 4 5 0 10"/><path d="M19 -13 q 6 8 0 16" opacity="0.5"/></g>
      </g>
    </g>

    <!-- Un seul cuisinier : pointillé vers les casseroles qui cuisent, plein vers celle qui sonne -->
    <g style="color: var(--a2, #6f9455)" stroke="currentColor" fill="none" stroke-width="1.7" opacity="0.5">
      <path d="M562 196 C 546 190, 512 178, 490 162" stroke-dasharray="5 6"/>
      <path d="M570 196 V 160" stroke-dasharray="5 6"/>
      <path d="M578 196 C 594 190, 628 178, 650 162" stroke-width="2.2" opacity="1"/>
    </g>
    <g transform="translate(570,258)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1">
      <circle cx="0" cy="-7" r="11" fill="none"/>
      <path d="M-20 26 a 20 20 0 0 1 40 0" fill="none"/>
      <g transform="rotate(-5 0 -17.5)">
        <rect x="-15" y="-24" width="30" height="13" rx="2" fill="var(--body-background, #fff)"/>
        <path d="M-15 -24 C -29 -21, -31 -34, -25 -43 C -18 -53, 15 -54, 21 -44 C 26 -36, 25 -23, 15 -24 Z" fill="currentColor" fill-opacity="0.10"/>
        <g stroke-width="1.2" opacity="0.45" fill="none"><path d="M-11 -27 C -15 -36, -14 -43, -11 -48"/><path d="M-1 -28 C -3 -38, -3 -45, -3 -51"/><path d="M10 -27 C 12 -36, 9 -43, 6 -47"/></g>
      </g>
    </g>

    <text x="570" y="318" font-size="13.5" text-anchor="middle" opacity="0.75">un cuisinier, une sonnette par casserole</text>
    <text x="570" y="336" font-size="13.5" text-anchor="middle" opacity="0.75">il change de casserole quand l'une sonne</text>
  </g>
</svg>
