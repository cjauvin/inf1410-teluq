<svg xmlns="http://www.w3.org/2000/svg" viewBox="101 48 816 453" class="fig-svg" role="img"
     aria-label="Graphique en échelle logarithmique couvrant 1970 à 2025. Le nombre de transistors par puce suit une droite qui monte sans jamais fléchir sur toute la période. La fréquence d'horloge monte parallèlement à elle jusque vers 2004, puis s'aplatit brusquement et ne remonte plus. Le nombre de coeurs par puce reste plat à un seul coeur pendant tout ce temps, puis décolle exactement au moment où la fréquence plafonne. Les deux dernières courbes forment une symétrie : la troisième démarre là où la deuxième s'arrête.">

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">

    <!-- Axes -->
    <g stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M150 60 V 430 H 748"/>
      <path d="M144 72 L 150 60 L 156 72"/>
      <path d="M736 424 L 748 430 L 736 436"/>
    </g>

    <!-- Graduations des décennies -->
    <g stroke="currentColor" stroke-width="1.2" opacity="0.35">
      <path d="M150 430 v 6"/><path d="M257 430 v 6"/><path d="M364 430 v 6"/>
      <path d="M471 430 v 6"/><path d="M578 430 v 6"/><path d="M685 430 v 6"/>
    </g>
    <g font-size="13" text-anchor="middle" opacity="0.6">
      <text x="150" y="455">1970</text><text x="257" y="455">1980</text>
      <text x="364" y="455">1990</text><text x="471" y="455">2000</text>
      <text x="578" y="455">2010</text><text x="685" y="455">2020</text>
    </g>

    <!-- L'échelle est logarithmique : c'est ce qui fait qu'une croissance
         exponentielle s'y lit comme une droite. Sans cette mention, la
         rectitude de la courbe des transistors serait incompréhensible. -->
    <text x="126" y="245" font-size="13" text-anchor="middle" opacity="0.6"
          transform="rotate(-90 126 245)">échelle logarithmique</text>

    <!-- Le moment de la bifurcation -->
    <g stroke="currentColor" fill="none" opacity="0.4" stroke-dasharray="3 4" stroke-width="1.3">
      <path d="M514 68 V 430"/>
    </g>
    <text x="514" y="455" font-size="13" text-anchor="middle" font-weight="600" opacity="0.85">2004</text>
    <text x="502" y="92" font-size="14" text-anchor="end" opacity="0.8">le repas gratuit s'arrête</text>

    <!-- Transistors : une droite, donc une exponentielle, sans inflexion.
         La loi de Moore n'a jamais cessé de tenir. -->
    <g style="color: var(--a1, #5b7fa6)">
      <path d="M150 330 L 740 75" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <text x="756" y="80" font-size="15" font-weight="600" fill="currentColor">Transistors par puce</text>
    </g>

    <!-- Fréquence : exactement la même pente, jusqu'à 2004. C'est la loi de
         Dennard qui la tirait, et c'est elle qui s'arrête ici. -->
    <g style="color: var(--a3, #c06e4a)">
      <path d="M150 385 L 514 228 L 740 218" stroke="currentColor" stroke-width="2.6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="756" y="223" font-size="15" font-weight="600" fill="currentColor">Fréquence d'horloge</text>
    </g>

    <!-- Coeurs : plats à un seul pendant trente ans, puis le relais est pris
         au moment précis où la fréquence plafonne. -->
    <g style="color: var(--a2, #6f9455)">
      <path d="M150 412 L 514 412 L 740 320" stroke="currentColor" stroke-width="2.6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="756" y="325" font-size="15" font-weight="600" fill="currentColor">Nombre de coeurs</text>
    </g>

    <text x="756" y="345" font-size="13" opacity="0.75">le relais est pris ici</text>

    <!-- Schéma : les formes et le moment de la bifurcation sont fidèles, les
         valeurs ne sont pas des données mesurées. Le dire évite qu'on lise le
         graphique comme une source. -->
    <text x="150" y="486" font-size="13" opacity="0.6">Schéma. Les formes et la date de bifurcation sont fidèles, les valeurs ne sont pas des mesures.</text>
  </g>
</svg>
