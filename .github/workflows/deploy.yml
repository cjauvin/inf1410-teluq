name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      # Les livres PDF et EPUB, à partir de la page /livre/ (scripts/livre/generer.py),
      # écrits dans public/telechargements/ et offerts par la page « Télécharger le cours en livre ».
      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc librsvg2-bin fonts-dejavu-core \
            texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-lang-french lmodern fonts-texgyre fonts-texgyre-math \
            fonts-wqy-microhei
          luaotfload-tool --update || true

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build PDF and EPUB
        run: uv run scripts/livre/generer.py --site public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public