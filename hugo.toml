baseURL = 'https://cjauvin.github.io/inf1410-teluq/'
locale = 'fr'
defaultContentLanguage = 'fr'

# canonifyURLs (option héritée, déconseillée par Hugo) a été retirée en août
# 2026 : elle cassait la résolution de relURL dans le search.js du thème, donc
# la recherche. Elle ne servait qu'à rattraper les chemins absolus du shortcode
# applet, qui passent désormais explicitement par relURL.

title = "INF1410 - Initiation au génie logiciel"
theme = 'hugo-book'

# Dépôts clonés et environnements virtuels servant d'exemples : Hugo n'a
# aucune raison de les scanner, et depuis 0.158 leurs fichiers .html font
# échouer le build (politique security.allowContent).
ignoreFiles = [
  '/\.venv/',
  '/60-ia/requests/',
  '/60-ia/requests-explore/',
]

# --- Paramètres du thème hugo-book ---
[params]
BookMenuBundle = "book"
BookTheme = "auto"
BookToC = true
BookSearch = true
BookPortableLinks = "warning"
BookLogo = "images/2gears.png"
BookFavicon = "images/2gears.png"

# Formulaire de retour anonyme en fin de page (voir
# layouts/partials/docs/comments.html). Désactivé le 31 août 2026, le temps de
# lui trouver un meilleur point d'arrivée. Vide, ni le bloc ni le raccourci de
# la table des matières ne sont rendus, les deux partageant la même garde.
#
# Le relais essayé était FormSubmit, avec l'identifiant haché
# 22d185756eee46a07d2c0af2efc35214, valide pour localhost et cjauvin.github.io.
# Il a été abandonné parce qu'il répond « submitted successfully » puis jette
# le message sans rien dire. Sa documentation l'explique : quand le reCAPTCHA
# est désactivé, ce que faisait _captcha=false pour épargner l'écran de
# vérification aux étudiants, le service applique ses propres heuristiques et
# ignore silencieusement ce qu'il juge automatique.
#
# Un canal de retour qui perd des messages sans le signaler est pire que pas
# de canal : on conclurait que les étudiants ne disent rien alors qu'ils
# écrivent. La suite envisagée est un Worker Cloudflare qui relaie vers un
# canal Discord privé, sans courriel dans le chemin, donc sans filtre ni
# quota ni tri opaque.
RetourEndpoint = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
