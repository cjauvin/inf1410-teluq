baseURL = 'https://cjauvin.github.io/inf1410-teluq/'
locale = 'fr'
defaultContentLanguage = 'fr'

# canonifyURLs (option héritée, déconseillée par Hugo) a été retirée en août
# 2026 : elle cassait la résolution de relURL dans le search.js du thème, donc
# la recherche. Elle ne servait qu'à rattraper les chemins absolus du shortcode
# applet, qui passent désormais explicitement par relURL.

title = "INF1410 - Initiation au génie logiciel"
theme = 'hugo-book'

# Dépôts clonés et environnements virtuels servant d'exemples : Hugo n'a
# aucune raison de les scanner, et depuis 0.158 leurs fichiers .html font
# échouer le build (politique security.allowContent).
ignoreFiles = [
  '/\.venv/',
  '/60-ia/requests/',
  '/60-ia/requests-explore/',
]

# --- Paramètres du thème hugo-book ---
[params]
BookMenuBundle = "book"
BookTheme = "auto"
BookToC = true
BookSearch = true
BookPortableLinks = "warning"
BookLogo = "images/2gears.png"
BookFavicon = "images/2gears.png"

# Point d'arrivée du formulaire de retour anonyme affiché en fin de page (voir
# layouts/partials/docs/comments.html). Un relais formulaire-vers-courriel, qui
# réexpédie le message sans rien exiger de l'étudiant.
#
# Mise en service, en deux temps :
#   1. déclencher le courriel d'activation, puis cliquer le lien qu'il contient.
#      FormSubmit exige les en-têtes Origin et Referer, faute de quoi il répond
#      200 en renvoyant sa page d'accueil, sans le moindre message d'erreur :
#
#        curl -X POST -H "Content-Type: application/json" \
#             -H "Origin: https://cjauvin.github.io" \
#             -H "Referer: https://cjauvin.github.io/" \
#             -d '{"message":"activation"}' \
#             https://formsubmit.co/ajax/<son-adresse>
#
#      Le point d'arrivée /ajax/ répond en JSON, donc il dit ce qui cloche ;
#   2. reporter ici l'identifiant haché renvoyé, et non l'adresse en clair, qui
#      serait autrement visible dans le code source de chaque page.
#
# Vide, le bloc n'est pas affiché du tout : le site ne publie donc jamais un
# formulaire qui n'aboutit nulle part.
RetourEndpoint = "https://formsubmit.co/22d185756eee46a07d2c0af2efc35214"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
